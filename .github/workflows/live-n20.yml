name: TCC N20 live benchmark

on:
  push:
    branches: [codex/tcc-live-n20-personal]
    paths: ["n20-runtime/**", ".github/workflows/live-n20.yml"]
  workflow_dispatch:
    inputs:
      operation:
        description: "Preflight only, or run one scenario on an existing dedicated CUDA runner"
        type: choice
        default: preflight
        options: [preflight, live]
      scenario:
        description: "Scenario to run (used only for live execution)"
        type: choice
        default: pilot
        options: [pilot]
      run_id:
        description: "Controller-assigned 32-character lowercase hex run ID (required for live)"
        type: string
        required: false
      acknowledge_live:
        description: "Authorize this workflow to consume existing runner time (no provisioning)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r sistema/requirements-node.txt -r sistema/requirements-orchestrator.txt
        working-directory: n20-runtime
      - name: Validate topology and test dedicated inference with mocks
        working-directory: n20-runtime
        run: |
          python -m infra.runpod.n20.benchmark preflight
          python -m unittest sistema.tests.test_dedicated_inference sistema.tests.test_dedicated_orchestrator sistema.tests.test_runner_per_node
          python -m unittest infra.runpod.n20.test_benchmark infra.runpod.n20.test_r2_verified_pilot infra.runpod.n20.test_watchdog
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Provider-free Terraform preflight
        working-directory: n20-runtime/infra/runpod/n20
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
          terraform plan -input=false -refresh=false -no-color

  live:
    if: '${{ github.event_name == ''workflow_dispatch'' && github.ref == ''refs/heads/codex/tcc-live-n20-personal'' && inputs.operation == ''live'' && inputs.acknowledge_live && vars.TCC_LIVE_N20_ENABLED == ''true'' }}'
    needs: preflight
    environment: tcc-live-n20
    runs-on: [self-hosted, linux, x64, tcc-n20-cuda]
    timeout-minutes: 120
    concurrency:
      group: tcc-live-n20-gpu
      cancel-in-progress: false
    env:
      TCC_LIVE_N20_APPROVED: "true"
      NVIDIA_MODEL_SNAPSHOT: '${{ vars.TCC_LIVE_N20_SNAPSHOT }}'
      TCC_LIVE_N20_PEAK_VRAM_PER_NODE_GIB: '${{ vars.TCC_LIVE_N20_PEAK_VRAM_PER_NODE_GIB }}'
      TCC_N20_DURABLE_ROOT: '${{ vars.TCC_N20_DURABLE_ROOT }}'
      N20_RUN_ID: '${{ inputs.run_id }}'
      TCC_N20_CONTROLLER_STATE: '${{ vars.TCC_N20_CONTROLLER_STATE }}'
      TCC_N20_RESOURCE_ID: '${{ vars.TCC_N20_RESOURCE_ID }}'
      SCENARIO: '${{ inputs.scenario }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run and verify 100 pilot generations
        working-directory: n20-runtime
        run: |
          test -n "$NVIDIA_MODEL_SNAPSHOT"
          test -n "$TCC_LIVE_N20_PEAK_VRAM_PER_NODE_GIB"
          test -d "$TCC_N20_DURABLE_ROOT"
          test -n "$N20_RUN_ID"
          python -m infra.runpod.n20.benchmark run --scenario "$SCENARIO" --seed 0 \
            --snapshot "$NVIDIA_MODEL_SNAPSHOT" --durable-root "$TCC_N20_DURABLE_ROOT" \
            --run-id "$N20_RUN_ID" \
            --controller-state "$TCC_N20_CONTROLLER_STATE" --resource-id "$TCC_N20_RESOURCE_ID"
