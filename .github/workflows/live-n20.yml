name: TCC N20 live benchmark

on:
  push:
    branches: [codex/tcc-live-n20-personal]
    paths: ["n20-runtime/**", ".github/workflows/live-n20.yml"]
  workflow_dispatch:
    inputs:
      operation:
        description: "Preflight only, or run one scenario on an existing dedicated CUDA runner"
        type: choice
        default: preflight
        options: [preflight, live]
      scenario:
        description: "Scenario to run (used only for live execution)"
        type: choice
        default: pilot
        options: [pilot, C01, C16, C17, C10, C14, C11, C02, C03, C08, C04, C05, C09, C06, C07, C12, C15, C13]
      run_id:
        description: "Controller-assigned 32-character lowercase hex run ID (required for live)"
        type: string
        required: false
      acknowledge_live:
        description: "Authorize this workflow to consume existing runner time (no provisioning)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r sistema/requirements-node.txt -r sistema/requirements-orchestrator.txt
        working-directory: n20-runtime
      - name: Validate topology and test dedicated inference with mocks
        working-directory: n20-runtime
        run: |
          python -m infra.runpod.n20.benchmark preflight
          python -m unittest sistema.tests.test_dedicated_inference sistema.tests.test_dedicated_orchestrator sistema.tests.test_runner_per_node
          python -m unittest infra.runpod.n20.test_benchmark infra.runpod.n20.test_r2_verified_pilot infra.runpod.n20.test_watchdog infra.runpod.n20.test_checkpoint infra.runpod.n20.test_batch_sequence sistema.tests.test_reputation_trace
          python -m unittest infra.runpod.n20.test_local_pilots infra.runpod.n20.test_r2_pilot infra.runpod.n20.test_r2_pilot_prompt infra.runpod.n20.test_local_recovery infra.runpod.n20.test_same_host_batch
      - name: Exercise C13 50-round HTTP protocol using stand-in inference
        working-directory: n20-runtime
        run: python -m infra.runpod.n20.integration_smoke run --scenario C13 --output "$RUNNER_TEMP/tcc-n20-offline-c13"
      - name: Verify HTTP pilot restart and per-round replication (no provider)
        working-directory: n20-runtime
        run: |
          pilot="$RUNNER_TEMP/tcc-n20-offline-restart"
          python -m infra.runpod.n20.resume_smoke run --output "$pilot"
          id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["checkpoint_run_id"])' "$pilot/reference/integration-report.json")"
          python -m infra.runpod.n20.checkpoint_replication_smoke --source "$pilot/reference/$id" --output "$RUNNER_TEMP/tcc-n20-offline-copies"
      - name: Verify full C13 restart and physical stand-in generation count
        working-directory: n20-runtime
        run: python -m infra.runpod.n20.resume_smoke run --scenario C13 --cut-round 17 --output "$RUNNER_TEMP/tcc-n20-offline-c13-restart"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Provider-free Terraform preflight
        working-directory: n20-runtime/infra/runpod/n20
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
          terraform plan -input=false -refresh=false -no-color

  live:
    if: '${{ github.event_name == ''workflow_dispatch'' && github.ref == ''refs/heads/codex/tcc-live-n20-personal'' && inputs.operation == ''live'' && inputs.acknowledge_live && vars.TCC_LIVE_N20_ENABLED == ''true'' && (inputs.scenario == ''pilot'' || vars.TCC_N20_OFFICIAL_QUALIFIED == ''true'') }}'
    needs: preflight
    environment: tcc-live-n20
    runs-on: [self-hosted, linux, x64, tcc-n20-cuda]
    timeout-minutes: 120
    concurrency:
      group: tcc-live-n20-gpu
      cancel-in-progress: false
    env:
      TCC_LIVE_N20_APPROVED: "true"
      TCC_N20_OFFICIAL_QUALIFIED: '${{ vars.TCC_N20_OFFICIAL_QUALIFIED }}'
      NVIDIA_MODEL_SNAPSHOT: '${{ vars.TCC_LIVE_N20_SNAPSHOT }}'
      TCC_LIVE_N20_PEAK_VRAM_PER_NODE_GIB: '${{ vars.TCC_LIVE_N20_PEAK_VRAM_PER_NODE_GIB }}'
      TCC_N20_DURABLE_ROOT: '${{ vars.TCC_N20_DURABLE_ROOT }}'
      N20_RUN_ID: '${{ inputs.run_id }}'
      TCC_N20_CONTROLLER_STATE: '${{ vars.TCC_N20_CONTROLLER_STATE }}'
      TCC_N20_RESOURCE_ID: '${{ vars.TCC_N20_RESOURCE_ID }}'
      SCENARIO: '${{ inputs.scenario }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run and verify one pilot or official scenario
        working-directory: n20-runtime
        run: |
          test -n "$NVIDIA_MODEL_SNAPSHOT"
          test -n "$TCC_LIVE_N20_PEAK_VRAM_PER_NODE_GIB"
          test -d "$TCC_N20_DURABLE_ROOT"
          test -n "$N20_RUN_ID"
          python -m infra.runpod.n20.benchmark run --scenario "$SCENARIO" --seed 0 \
            --snapshot "$NVIDIA_MODEL_SNAPSHOT" --durable-root "$TCC_N20_DURABLE_ROOT" \
            --run-id "$N20_RUN_ID" \
            --controller-state "$TCC_N20_CONTROLLER_STATE" --resource-id "$TCC_N20_RESOURCE_ID"
